scan_timeout = 10

add_newline = false
command_timeout = 2000

[directory]
truncate_to_repo = false
truncation_length = 100

[kubernetes]
format = '[☸](red)[ $context \($namespace\)](red) '
disabled = false
style = 'cyan bold'

[os]
disabled = false

[os.symbols]
Macos = " "

